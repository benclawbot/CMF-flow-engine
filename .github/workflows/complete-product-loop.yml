name: Complete Flow product loop

on:
  push:
    branches: [complete-flow-product-loop]

permissions:
  contents: write

concurrency:
  group: complete-flow-product-loop
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete-flow-product-loop
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply remaining product-loop improvements
        run: python .github/scripts/complete_product_loop.py
      - name: Lint, test and build
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Remove temporary workflow scaffolding
        run: rm -f .github/workflows/complete-product-loop.yml .github/scripts/complete_product_loop.py .product-loop-trigger
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Complete Flow product loop"
          git push origin HEAD:complete-flow-product-loop
