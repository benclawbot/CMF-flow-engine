name: Apply product loop refactor
on:
  push:
    branches: [improve-flow-product-loop]
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve-flow-product-loop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refactor product UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/benclawbot/cmfflow/ProductApp.kt')
          s = p.read_text()

          # Insights: explicit high-contrast metric text and compact low-data chart state.
          s = s.replace('Text(label, color = MaterialTheme.colorScheme.onSurfaceVariant, style = MaterialTheme.typography.bodySmall)\n            Text(value, style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)',
                        'Text(label, color = Color(0xFF332F3A), style = MaterialTheme.typography.bodySmall, fontWeight = FontWeight.Medium)\n            Text(value, color = Color(0xFF17141C), style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)')
          s = s.replace('Sparkline(reports.take(30).reversed().map { it.flowScore.toFloat() })\n                Text("${reports.size.coerceAtMost(100)} recent local check-ins", color = MaterialTheme.colorScheme.onSurfaceVariant)',
                        'if (reports.size >= 2) {\n                    Sparkline(reports.take(30).reversed().map { it.flowScore.toFloat() })\n                } else {\n                    Text("One check-in is not enough for a trend yet.", color = MaterialTheme.colorScheme.onSurfaceVariant)\n                }\n                Text("${reports.size.coerceAtMost(100)} recent local check-ins", color = MaterialTheme.colorScheme.onSurfaceVariant)')
          s = s.replace('summary.strongestDomain?.let {\n                    Text("Your strongest sampled area so far is ${it.replaceFirstChar(Char::uppercase)}.")\n                } ?: Text("Domain patterns unlock after enough comparable check-ins.")',
                        'summary.strongestDomain?.let {\n                    Text("Emerging pattern", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.SemiBold)\n                    Text("Your strongest sampled area so far is ${it.replaceFirstChar(Char::uppercase)}.")\n                } ?: run {\n                    Text("Early signal", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.SemiBold)\n                    Text("Flow needs more comparable check-ins before calling this a pattern.")\n                }')

          # Experiments: system proposes experiments; remove user-authored A/B form and + button.
          old_header = '''        Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.fillMaxWidth()) {
            Column(Modifier.weight(1f)) { ScreenHeader("Experiments", "Balanced randomized N-of-1 trials, linked to your next check-in.") }
            IconButton(onClick = { adding = !adding }) { Icon(Icons.Filled.Add, "Add experiment") }
        }'''
          new_header = '''        ScreenHeader("Experiments", "Flow proposes balanced N-of-1 trials when your data supports something worth testing.")'''
          s = s.replace(old_header, new_header)
          start = s.find('        if (adding) {', s.find('private fun ProductExperimentsScreen'))
          end = s.find('\n\n        if (experiments.isEmpty()) {', start)
          if start != -1 and end != -1:
              s = s[:start] + '''        if (experiments.isEmpty() && reports.size >= 3) {
            val suggestion = suggestedExperiment(reports)
            ElevatedCard(Modifier.fillMaxWidth(), shape = RoundedCornerShape(26.dp)) {
                Column(Modifier.padding(20.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                    Text("Suggested experiment", style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.primary)
                    Text(suggestion.hypothesis, style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)
                    Text("A · ${suggestion.conditionA}", color = MaterialTheme.colorScheme.onSurfaceVariant)
                    Text("B · ${suggestion.conditionB}", color = MaterialTheme.colorScheme.onSurfaceVariant)
                    Text("Why this? Flow is turning an observed state into a controlled test instead of treating correlation as causation.", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                    Button(onClick = { onAdd(suggestion) }, modifier = Modifier.fillMaxWidth()) { Text("Start this experiment") }
                }
            }
        }''' + s[end:]
          s = s.replace('EmptyCard("No active experiments", "Try “Does a 5-minute walk improve my next focus block?” or “Does asking AI earlier reduce fatigue?”")',
                        'if (reports.size < 3) EmptyCard("Flow is still learning", "Keep checking in. Flow will propose an experiment once there is enough comparable evidence.")')

          # Remove now-unused manual experiment form state.
          s = s.replace('    var adding by remember { mutableStateOf(false) }\n    var hypothesis by remember { mutableStateOf("") }\n    var conditionA by remember { mutableStateOf("") }\n    var conditionB by remember { mutableStateOf("") }\n\n', '')

          # Add deterministic system suggestion helper.
          marker = '\nprivate fun formatScore(value: Double?): String'
          helper = '''
private fun suggestedExperiment(reports: List<SelfReportEntity>): ExperimentEntity {
    val recent = reports.take(5)
    val fatigue = recent.map { it.fatigue }.average()
    val presence = recent.map { it.presence }.average()
    return when {
        fatigue >= 3.5 -> ExperimentEntity(
            hypothesis = "Does a 5-minute movement break reduce fatigue in my next focus block?",
            conditionA = "Take a 5-minute movement break first",
            conditionB = "Continue normally",
        )
        presence <= 2.5 -> ExperimentEntity(
            hypothesis = "Does protecting 10 minutes from interruptions improve my presence?",
            conditionA = "Use 10 interruption-free minutes first",
            conditionB = "Continue normally",
        )
        else -> ExperimentEntity(
            hypothesis = "Does a 5-minute walk improve my next focus block?",
            conditionA = "Take a 5-minute walk first",
            conditionB = "Continue normally",
        )
    }
}
'''
          s = s.replace(marker, helper + marker)
          p.write_text(s)
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/benclawbot/cmfflow/ProductApp.kt
          git diff --cached --quiet || git commit -m "Improve insights and system-proposed experiments"
          git push
