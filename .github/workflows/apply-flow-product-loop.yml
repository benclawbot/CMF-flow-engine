name: Apply Flow product loop branch update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-flow-product-loop.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve-flow-product-loop
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply product changes
        run: python tools/apply_product_loop.py
      - name: Remove temporary branch helpers
        run: rm -f tools/apply_product_loop.py .github/workflows/apply-product-loop.yml
      - name: Lint, test and build
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/benclawbot/cmfflow/ProductApp.kt tools/apply_product_loop.py .github/workflows/apply-product-loop.yml
          git commit -m "Improve Flow product loop and task synchronization"
          git push origin HEAD:improve-flow-product-loop
