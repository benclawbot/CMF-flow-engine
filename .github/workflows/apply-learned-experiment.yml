name: Apply learned experiment recommendation

on:
  push:
    branches: [complete-flow-product-loop]
    paths:
      - '.github/workflows/apply-learned-experiment.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete-flow-product-loop
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply learned recommendation changes
        run: python .github/scripts/apply_learned_experiment.py
      - name: Lint, test and build
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Remove temporary scaffolding
        run: rm -f .github/workflows/apply-learned-experiment.yml .github/scripts/apply_learned_experiment.py
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Use experiment evidence in future recommendations"
          git push origin HEAD:complete-flow-product-loop
