name: Issue 1 health validation diagnostics

on:
  push:
    branches: [issue-1-health-validation-diagnostics]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-1-health-validation-diagnostics
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply diagnostics patch
        run: python .github/scripts/issue1_patch.py
      - name: Lint, test and build
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Remove temporary scaffolding
        run: rm .github/workflows/issue-1-diagnostics.yml .github/scripts/issue1_patch.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Health Connect validation diagnostics"
          git push origin HEAD:issue-1-health-validation-diagnostics
